# PostgreSQL 16 para desenvolvimento local. Uso: docker compose up -d
services:
  db:
    image: postgres:16
    container_name: estoquefacil-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: estoquefacil
    ports:
      - "5432:5432"
    volumes:
      - estoquefacil-data:/var/lib/postgresql/data

volumes:
  estoquefacil-data:
